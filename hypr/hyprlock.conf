source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = ~/.cache/current_wallpaper.jpg
    blur_passes = 3
    blur_size = 15
    brightness = 0.35
    contrast = 0.9
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $on_surface
    font_size = 200
    font_family = JetBrainsMono Nerd Font Bold
    halign = left
    valign = center
    position = 120, 100
    shadow_passes = 5
    shadow_size = 15
    shadow_color = rgba(0, 0, 0, 0.6)
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d de %B')"
    color = $primary
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    halign = left
    valign = center
    position = 125, -50
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.6)
}

label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/player.sh
    color = $tertiary
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    halign = left
    valign = center
    position = 125, -120
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.6)
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.15
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = $primary
    inner_color = rgba(0, 0, 0, 0.4)
    font_color = $on_surface
    fade_on_empty = false
    rounding = 25
    check_color = $tertiary
    fail_color = $error
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $tertiary
    placeholder_text = Enter your password
    hide_input = false
    halign = left
    valign = center
    position = 120, -250
    shadow_passes = 4
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.6)
}
