default-timeout=5000
ignore-timeout=1
max-visible=3
anchor=top-center


width=350
margin=10
padding=15
border-size=2
border-radius=0
font=monospace 10
format=<b>%s</b>\n%b


background-color={{colors.surface_container.default.hex}}

text-color={{colors.on_surface.default.hex}}

border-color={{colors.primary.default.hex | saturate: 30.0, hsl}}

progress-color=over {{colors.tertiary.default.hex}}

[mode=do-not-disturb]
invisible=1
